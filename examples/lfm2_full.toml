# LFM2 Full Stack: combines Liquid Nanos + LFM2.5 (reasoning, instruct)
# Uses all 6 LFM2 models for a complete research/analysis pipeline.
#
# Nanos (task-specific): lfm2_tool, lfm2_extract, lfm2_math, lfm2_rag
# LFM2.5 (32K ctx): reasoning (Thinking), fast (Instruct)

[[steps]]
name = "search"
system_prompt = "You are a research agent. Search the web for information and collect key findings. Use search_memory for context."
goal_template = "Search for information about: {input}"
tools = ["web_search", "search_memory"]
role = "lfm2_tool"
max_steps = 3

[[steps]]
name = "extract"
system_prompt = "Extract key facts, entities, and keywords from the provided text."
goal_template = "Extract key facts and entities from:\n{prev_result}"
tools = []
role = "lfm2_extract"
max_steps = 2

[[steps]]
name = "analyze"
system_prompt = "You are an analytical reasoning agent. Think step by step. Break down the problem and identify patterns, implications, and connections."
goal_template = "Analyze the following and reason through key insights:\n{prev_result}"
tools = []
role = "reasoning"
max_steps = 3

[[steps]]
name = "quantify"
system_prompt = "Perform quantitative analysis. Identify numbers, statistics, and mathematical relationships. Compute or estimate values when relevant."
goal_template = "Extract and analyze quantitative aspects:\n{prev_result}"
tools = []
role = "lfm2_math"
max_steps = 2

[[steps]]
name = "synthesize"
system_prompt = "Synthesize all findings into a coherent, retrieval-augmented summary. Integrate search results, analysis, and quanitative insights."
goal_template = "Synthesize these findings into a structured report:\n{prev_result}"
tools = ["refine_memory"]
role = "lfm2_rag"
max_steps = 3

[[steps]]
name = "finalize"
system_prompt = "Produce a clear, concise final output. Be direct and actionable."
goal_template = "Write the final summary:\n{prev_result}"
tools = []
role = "fast"
max_steps = 2
