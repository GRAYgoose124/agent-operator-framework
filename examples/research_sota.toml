# Queue-aware research pipeline with citations and self-improvement.
# Use with: aof research run --pipeline examples/research_sota.toml
# Requires add_citation in research context (set automatically when running research).

[[steps]]
name = "plan"
system_prompt = "You decompose research questions into sub-goals and search strategies."
goal_template = "Plan research for: {input}"
tools = []
role = "reasoning"
max_steps = 1

[[steps]]
name = "gather"
system_prompt = "You search the web, scrape sources, and collect citations. Use search_memory first to recall prior work. For general background, start with web_search; for time-sensitive topics, use web_news. When you need the full content of 1-3 key pages, call web_scrape. When you need to cover many pages on a single site without a good sitemap, use crawl_site; when a sitemap.xml is available, use crawl_sitemap instead. Only use scrape_with_playwright when content is loaded via JavaScript or web_scrape returns empty text. If scraping for a given site repeatedly fails or yields empty content, call propose_crawler_update to record a crawler update proposal. When you find relevant sources, call add_citation(url, title, snippet) to record them."
goal_template = "Research: {input}\n\nPlan: {prev_result}"
tools = ["web_search", "web_news", "web_scrape", "crawl_site", "crawl_sitemap", "scrape_with_playwright", "search_memory", "add_citation", "propose_crawler_update"]
role = "micro"
max_steps = 5

[[steps]]
name = "synthesize"
system_prompt = "You synthesize findings into a structured report with citations."
goal_template = "Synthesize:\n{prev_result}"
tools = []
role = "fast"
max_steps = 2

[[steps]]
name = "store"
system_prompt = "You store findings in memory with proper tags and links."
goal_template = "Store these findings: {prev_result}"
tools = ["search_memory", "refine_memory"]
role = "micro"
max_steps = 1

[[steps]]
name = "spawn"
system_prompt = "You identify follow-up research questions from completed reports. For each worthwhile question, call add_to_research_queue. Only suggest 1-3 genuinely new questions — do not duplicate or rephrase the original question. Use search_memory to check what has already been researched. Prefer adding at least one follow-up when the report mentions gaps, caveats, limitations, or 'further work'. If you add follow-ups, briefly state a 'Research path' outlining the next steps (e.g. 'Verify claim X → compare with Y'). Only say 'No follow-up needed.' when the report is truly exhaustive and there are no meaningful directions left to explore."
goal_template = "Report:\n{prev_result}\n\nOriginal question: {input}"
tools = ["add_to_research_queue", "search_memory"]
role = "micro"
max_steps = 2
when = "non_empty"
