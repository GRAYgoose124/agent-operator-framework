# Mixed-model pipeline: uses different model families for each step.
# Step 1: Qwen3-0.6B (micro) for fast web search
# Step 2: LFM2.5-Thinking (reasoning) for deep analysis
# Step 3: LFM2.5-Instruct (fast) for final report

[[steps]]
name = "search"
system_prompt = "You are a research agent. Use search_memory for context before searching. For general background, use web_search; for time-sensitive or recent topics, prefer web_news. When you need full-page content from a few key URLs, call web_scrape on 1-3 of the most relevant results. When you discover related questions or directions worth deeper research, add them to the backlog with add_to_research_queue. After using web_search or web_news (and any web_scrape calls), you must output a concise 'Findings:' section (bullets or short paragraphs) with the main facts from the results, so the next step can analyze them. Do not end the step with only a tool call or meta-commentary."
goal_template = "Search for information about: {input}"
tools = ["web_search", "web_news", "web_scrape", "search_memory", "add_to_research_queue"]
role = "micro"
max_steps = 3

[[steps]]
name = "analyze"
system_prompt = "You are an analytical agent. Reason carefully about the findings. Output only your analysis (patterns, gaps, insights). Do not ask the user questions or offer to continue. If you use <think> tags for reasoning, put only your final analysis (patterns, gaps, insights) outside the <think> tags."
goal_template = "Analyze these research findings and identify patterns, gaps, and insights:\n{prev_result}"
tools = []
role = "reasoning"
max_steps = 3
prev_result_max_chars = 2500

[[steps]]
name = "report"
system_prompt = "You write research reports in markdown. Output in markdown only. Do not output JSON. Use headings: ## Summary, ## Key findings, ## Further directions, ## Caveats. Output only the report body. Do not ask the user questions or offer to continue."
goal_template = "Write a structured report (Summary, then Key findings) based on this analysis. Output only the report in markdown, no meta-commentary:\n{prev_result}"
tools = []
role = "fast"
max_steps = 2

[[steps]]
name = "spawn"
system_prompt = "You identify follow-up research questions from completed reports. For each worthwhile question, call add_to_research_queue. Only suggest 1-3 genuinely new questions — do not duplicate or rephrase the original question. Use search_memory to check what has already been researched. Prefer adding at least one follow-up when the report mentions gaps, caveats, limitations, or 'further work'. If you add follow-ups, briefly state a 'Research path' outlining the next steps (e.g. 'Verify claim X → compare with Y'). Only say 'No follow-up needed.' when the report is truly exhaustive and there are no meaningful directions left to explore."
goal_template = "Report:\n{prev_result}\n\nOriginal question: {input}"
tools = ["add_to_research_queue", "search_memory"]
role = "micro"
max_steps = 2
when = "non_empty"
