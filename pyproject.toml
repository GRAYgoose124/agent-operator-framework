[project]
name = "agent-operator-framework"
version = "0.1.0"
description = "Concurrent small-LLM agent framework with Zettelkasten memory and verified tool creation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python>=0.3",
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
    "playwright>=1.40",
    "nltk>=3.9",
    "numpy>=1.26",
    "duckduckgo-search>=6.0",
    "aiohttp>=3.9",
    "sentence-transformers>=5.2.2",
    "chromadb>=1.5.0",
    "deepagents>=0.4.1",
    "langgraph>=1.0.8",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.9",
    "langchain>=1.2.10",
    "beautifulsoup4>=4.14.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Agentic memory (A-MEM): LLM-enriched memory with auto keywords/context/tags and evolution
# Needle (Cactus): tiny native model for fielded extraction/classification (Needle 3 preferred, 2 fallback)
needle = ["cactus-needle>=3.0"]
agentic = ["agentic-memory @ git+https://github.com/WujiangXu/A-mem-sys.git"]

[project.scripts]
aof = "aof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aof"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
